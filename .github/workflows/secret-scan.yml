name: Secret Scan

on:
  push:
    # master-mac is the branch this repo actually develops on. Listing only
    # main/master meant the scan never ran on the code being written.
    branches: ["main", "master", "master-mac"]
  pull_request:
    branches: ["main", "master"]

jobs:
  detect-secrets:
    name: detect-secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      # Pinned to the rev in .pre-commit-config.yaml so CI and the local
      # hook agree on what counts as a secret. A CI that disagrees with the
      # pre-commit hook just teaches people to ignore CI.
      - name: Install detect-secrets
        run: pip install "detect-secrets==1.4.0"
      - name: Reject tracked account / login files
        run: python3 scripts/check_no_user_data.py
      # Same baseline as the pre-commit hook. Fails only on findings that are
      # NOT already audited into .secrets.baseline, so a new credential breaks
      # the build while line number shifts on existing audited secrets do not.
      - name: Run detect-secrets scan
        run: python3 scripts/check_secrets.py
