name: Secret Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  detect-secrets:
    name: detect-secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Run detect-secrets scan
        run: |
          detect-secrets scan > .secrets.scan
          python - << 'PY'
import json,sys
data = json.load(open('.secrets.scan'))
if data.get('results'):
    print('Secrets scanner found potential secrets: failing build')
    sys.exit(1)
print('No potential secrets found')
PY
