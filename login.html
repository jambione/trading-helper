<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Scanner — Login</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/css/styles.css?v=122" />
  <!-- All login styles live in styles.css under the Aurora Glass section. -->
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <img src="/static/icons/logo.png" class="login-logo-img" alt="Brasfield Momentum">
      <span>Brasfield Momentum</span>
    </div>

    <div class="login-fields">

      <div id="login-error" class="login-error"></div>

      <div class="form-group">
        <label for="login-user">Username or email</label>
        <input id="login-user" type="text"
               placeholder="username or you@email.com"
               autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password"
               placeholder="••••••••"
               autocomplete="current-password" />
      </div>

      <button id="login-btn" class="btn btn--primary login-submit">Sign In</button>

    </div>

    <p class="login-hint">
      Need an account? <a href="/register">Request access</a>
      · <a href="/forgot">Forgot password</a>
    </p>

  </div>
</div>

<script>
(function () {
  const TOKEN_KEY  = 'ss:token';
  const BOUNCE_KEY = 'ss:login-bounce';
  const BOUNCE_MAX = 3;

  const wrap      = document.querySelector('.login-wrap');
  const userInput = document.getElementById('login-user');
  const passInput = document.getElementById('login-pass');
  const btn       = document.getElementById('login-btn');
  const errEl     = document.getElementById('login-error');

  function tokenStillGood(token) {
    if (!token) return false;
    try {
      const parts = token.split('.');
      if (parts.length !== 3) return false;
      const p   = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      const pad = p.length % 4 ? '='.repeat(4 - p.length % 4) : '';
      const { exp } = JSON.parse(atob(p + pad));
      return (exp || 0) > Date.now() / 1000;
    } catch {
      return false;
    }
  }

  function showError(msg) {
    errEl.textContent   = msg;
    errEl.style.display = 'block';
  }

  // Trips this tab has made to the login page and back. The gate on "/" reads
  // the HttpOnly cookie and this page reads the token in localStorage; when
  // those two disagree each side hands the browser straight back to the other
  // and the page does nothing but flash. Three trips is more than a real
  // sign-in ever needs, so past that we stop and say what is wrong.
  function countBounce() {
    try {
      const n = (parseInt(sessionStorage.getItem(BOUNCE_KEY) || '0', 10) || 0) + 1;
      sessionStorage.setItem(BOUNCE_KEY, String(n));
      return n;
    } catch {
      return 1;   // no sessionStorage (private window) — never block
    }
  }

  // A token in localStorage is not proof the server will take it: a navigation
  // to "/" carries only the cookie, and this page cannot check a signature.
  // /api/meta gives the server's own verdict, and when it accepts the token it
  // re-issues the session cookie — which repairs the case that caused the loop.
  async function sessionIsLive(token) {
    try {
      const res = await fetch('/api/meta', {
        credentials: 'include',
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) return false;
      const meta = await res.json();
      if (meta.token) localStorage.setItem(TOKEN_KEY, meta.token);
      return !!meta.username || meta.auth_required === false;
    } catch {
      return false;   // backend unreachable — show the form, don't bounce
    }
  }

  async function resumeSession() {
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) return;
    if (!tokenStillGood(token)) {
      localStorage.removeItem(TOKEN_KEY);
      return;
    }

    if (countBounce() > BOUNCE_MAX) {
      localStorage.removeItem(TOKEN_KEY);
      showError('Signed in, but this browser is not keeping the session cookie, '
              + 'so the dashboard sends you straight back here. Allow cookies '
              + 'for this site, then sign in again.');
      return;
    }

    // Hide the form for the round trip so a returning visitor sees one load,
    // not a form that appears and is immediately replaced.
    if (wrap) wrap.style.visibility = 'hidden';
    if (await sessionIsLive(token)) {
      window.location.href = '/';
      return;
    }
    // The server rejected it — an old signing secret, a revoked account.
    // Dropping it here is what stops the next load from trying again.
    localStorage.removeItem(TOKEN_KEY);
    if (wrap) wrap.style.visibility = '';
  }

  async function login() {
    errEl.style.display = 'none';

    const username = userInput.value.trim();
    const password = passInput.value;

    if (!username) { showError('Username is required'); return; }
    if (!password) { showError('Password is required'); return; }

    btn.disabled    = true;
    btn.textContent = 'Signing in\u2026';

    try {
      const res  = await fetch('/auth/login', {
        method:  'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok || !data.token) {
        showError(data.error || 'Invalid credentials');
        return;
      }

      localStorage.setItem(TOKEN_KEY, data.token);
      window.location.href = '/';

    } catch (e) {
      showError('Connection failed: ' + e.message);
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Sign In';
    }
  }

  btn.addEventListener('click', login);
  [userInput, passInput].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') login(); })
  );

  resumeSession();
})();
</script>

</body>
</html>
