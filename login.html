<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Scanner — Login</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=7" />
  <style>
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }

    .login-card {
      width: 380px;
      max-width: calc(100vw - 32px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 36px 32px 28px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .login-brand-icon  { font-size: 22px; color: var(--accent); }
    .login-brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .login-fields { display: flex; flex-direction: column; gap: 16px; }

    .login-error {
      font-size: 12px;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: var(--r-sm);
      padding: 9px 12px;
      display: none;
    }

    .login-submit {
      width: 100%;
      justify-content: center;
      padding: 11px;
      margin-top: 6px;
      font-size: 13px;
    }

    .login-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }
    .login-hint code {
      font-family: var(--font-mono);
      background: var(--card);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-icon">◈</span>
      <span class="login-brand-title">Signal Scanner</span>
    </div>

    <div class="login-fields">

      <div id="login-error" class="login-error"></div>

      <div class="form-group">
        <label for="backend-url">Backend URL</label>
        <input id="backend-url" type="url"
               placeholder="http://localhost:8888"
               autocomplete="url" spellcheck="false" />
        <span class="hint">Your local server or Cloudflare tunnel URL</span>
      </div>

      <div class="form-group">
        <label for="login-user">Username</label>
        <input id="login-user" type="text"
               placeholder="admin"
               autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password"
               placeholder="••••••••"
               autocomplete="current-password" />
      </div>

      <button id="login-btn" class="btn btn--primary login-submit">Sign In</button>

    </div>

    <p class="login-hint">
      Set credentials via <code>secrets.json</code> or environment variables.<br>
      Default: <code>admin</code> / <code>changeme</code>
    </p>

  </div>
</div>

<script>
(function () {
  const TOKEN_KEY   = 'ss:token';
  const BACKEND_KEY = 'ss:backend-url';

  // Pre-fill backend URL from storage, then fall back to current origin
  const urlInput  = document.getElementById('backend-url');
  const userInput = document.getElementById('login-user');
  const passInput = document.getElementById('login-pass');
  const btn       = document.getElementById('login-btn');
  const errEl     = document.getElementById('login-error');

  urlInput.value = localStorage.getItem(BACKEND_KEY) || window.location.origin;

  function showError(msg) {
    errEl.textContent    = msg;
    errEl.style.display  = 'block';
  }

  async function login() {
    errEl.style.display = 'none';

    const backendUrl = urlInput.value.trim().replace(/\/$/, '');
    const username   = userInput.value.trim();
    const password   = passInput.value;

    if (!backendUrl) { showError('Backend URL is required');  return; }
    if (!username)   { showError('Username is required');     return; }
    if (!password)   { showError('Password is required');     return; }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';

    try {
      const res  = await fetch(`${backendUrl}/auth/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok || !data.token) {
        showError(data.error || 'Invalid credentials');
        return;
      }

      localStorage.setItem(TOKEN_KEY, data.token);

      // Only persist backend URL if it's a remote server (not this same origin)
      if (backendUrl !== window.location.origin) {
        localStorage.setItem(BACKEND_KEY, backendUrl);
      } else {
        localStorage.removeItem(BACKEND_KEY);
      }

      window.location.href = '/';

    } catch (e) {
      showError('Connection failed: ' + e.message);
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Sign In';
    }
  }

  btn.addEventListener('click', login);
  [urlInput, userInput, passInput].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') login(); })
  );
})();
</script>

</body>
</html>
