repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.261
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: check-js-versions
        name: check JS ?v= cache-bust versions are consistent
        entry: python scripts/check_js_versions.py
        language: system
        pass_filenames: false
        files: '(static/js/.*\.js|dashboard\.html)$'
